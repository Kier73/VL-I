name: PBG-006 source-qualified neural trace learning

on:
  pull_request:
    paths:
      - 'src/vli/neural_trace_ground.py'
      - 'tests/test_neural_trace_ground_math.py'
      - 'tests/test_neural_trace_ground_native.py'
      - 'docs/NEURAL_TRACE_GROUND_PBG006.md'
      - '.github/workflows/pbg006-native-trace.yml'
  push:
    branches: [main]
    paths:
      - 'src/vli/neural_trace_ground.py'
      - 'tests/test_neural_trace_ground_math.py'
      - 'tests/test_neural_trace_ground_native.py'
      - '.github/workflows/pbg006-native-trace.yml'

permissions:
  contents: read

jobs:
  source-qualified-neural-ground:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/VL-64
          ref: fea0d29d5a8a1edb03d9c66edd5ca4b15a1395d3
          path: upstream/vl64
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: f9ed67c495b00f9d26df47e291b40b41070cb609
          path: upstream/ecpu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ae3f949b7d0b2aaa42236bc7cc37e9857384b174
          path: upstream/vgi
          sparse-checkout: |
            virtual_ground_interpreter
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: upstream/navigable
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned native-source and evidence packages
        run: |
          python -m pip install -e . -e upstream/vl64 -e upstream/ecpu -e upstream/navigable -e upstream/vgi/virtual_ground_interpreter 'numpy>=1.26' 'pytest>=8'
      - name: Native Qwen trained causal observation, exact-rational learned Ground, E-CPU/VGI admission
        run: |
          python -c "import sys,pytest; sys.path.insert(0,'tests'); sys.path.insert(0,'upstream/vl64/tests'); raise SystemExit(pytest.main(['-q','tests/test_neural_trace_ground_math.py','tests/test_neural_trace_ground_native.py','tests/test_source_hankel_ground.py','tests/test_source_hankel_fabric.py','tests/test_causal_basis_expansion.py','tests/test_qwen_layer_chain.py']))"
