name: TDL-002 minimal refinement and representation translation
on:
  push:
    paths:
      - 'src/vli/minimal_refinement.py'
      - 'src/vli/minimal_refinement_verify.py'
      - 'tests/test_minimal_refinement.py'
      - 'tests/test_translation_commutation.py'
      - '.github/workflows/tdl002-minimal-refinement.yml'
  pull_request:
    paths:
      - 'src/vli/minimal_refinement.py'
      - 'src/vli/minimal_refinement_verify.py'
      - 'tests/test_minimal_refinement.py'
      - 'tests/test_translation_commutation.py'
      - '.github/workflows/tdl002-minimal-refinement.yml'

jobs:
  independent-equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: VL-I
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: Navigable-Compute
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 2c925e177734b88d4cf32961b24028dfee771e68
          path: E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install independent producer and source ground packages
        run: |
          python -m pip install -e ./Navigable-Compute
          python -m pip install -e ./E-CPU
          python -m pip install -e ./VL-I
      - name: Verify minimal witnesses and adversarial cases
        run: python -m unittest discover -s VL-I/tests -p test_minimal_refinement.py -v
      - name: Check independent E-CPU Moore / NCR affine commutation
        run: python -m unittest discover -s VL-I/tests -p test_translation_commutation.py -v
      - name: Check unchanged PFI-001 succession API
        run: python -m unittest discover -s VL-I/tests -p test_problem_formed_interpreter.py -v
