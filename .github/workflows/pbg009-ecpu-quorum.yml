name: PBG-009 E-CPU quorum-fenced active neural recovery

on:
  pull_request:
    paths:
      - 'src/vli/quorum_neural_observation.py'
      - 'tests/test_quorum_neural_math.py'
      - 'tests/test_quorum_neural_observation.py'
      - 'docs/QUORUM_FENCED_NEURAL_OBSERVATION_PBG009.md'
      - '.github/workflows/pbg009-ecpu-quorum.yml'
  push:
    branches: [main]
    paths:
      - 'src/vli/quorum_neural_observation.py'
      - 'tests/test_quorum_neural_math.py'
      - 'tests/test_quorum_neural_observation.py'
      - '.github/workflows/pbg009-ecpu-quorum.yml'

permissions:
  contents: read

jobs:
  ecpu-quorum-neural-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/VL-64
          ref: fea0d29d5a8a1edb03d9c66edd5ca4b15a1395d3
          path: upstream/vl64
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 7e73e8498d1f18374ec07a167c8a7352ab4e96f4
          path: upstream/ecpu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ae3f949b7d0b2aaa42236bc7cc37e9857384b174
          path: upstream/vgi
          sparse-checkout: |
            virtual_ground_interpreter
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: upstream/navigable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kier73/In-Formation-Space
          ref: bfecbfc8b0e1f64e4998617d03654c3c220b39a1
          path: upstream/ifs
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing native source and quorum components
        run: |
          python -m pip install -e . -e upstream/vl64 -e upstream/ecpu -e upstream/navigable -e upstream/vgi/virtual_ground_interpreter 'numpy>=1.26' 'pytest>=8'
      - name: E-CPU live quorum claim, source-native Qwen, prepared restart and prior regressions
        run: |
          python -c "import sys,pytest; sys.path.insert(0,'tests'); sys.path.insert(0,'upstream/vl64/tests'); sys.path.insert(0,'upstream/ecpu/tests'); sys.path.insert(0,'upstream/ifs/bridges/proof-attention'); raise SystemExit(pytest.main(['-q','tests/test_quorum_neural_math.py','tests/test_quorum_neural_observation.py','tests/test_durable_neural_math.py','tests/test_durable_neural_acquisition.py','tests/test_active_neural_acquisition_math.py','tests/test_source_hankel_ground.py']))"
