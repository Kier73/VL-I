name: PFI-004/005 SAT Ground execution and interpreter revision
on:
  push:
    paths:
      - 'src/vli/problem_formed_sat.py'
      - 'src/vli/problem_formed_revision.py'
      - 'tests/test_problem_formed_sat.py'
      - 'tests/test_problem_formed_revision.py'
      - 'docs/PROBLEM_FORMED_SAT_PFI004.md'
      - 'docs/PROBLEM_FORMED_REVISION_PFI005.md'
      - '.github/workflows/problem-formed-sat.yml'
  pull_request:
    paths:
      - 'src/vli/problem_formed_sat.py'
      - 'tests/test_problem_formed_sat.py'
      - 'docs/PROBLEM_FORMED_SAT_PFI004.md'
      - '.github/workflows/problem-formed-sat.yml'
jobs:
  formed-sat:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: VL-I
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 559a1a813012d13ed37c04e2a117467e34ed3cb1
          path: Navigable-Compute
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 9064559d6e9b621034953b7135fc991a436d7746
          path: E-CPU
      - uses: actions/checkout@v4
        with:
          repository: Kier73/In-Formation-Space
          ref: d2022bf811dc89a9ae69a266148847bd443fa256
          path: In-Formation-Space
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned E-CPU and VL-I substrates
        run: |
          python -m pip install -e ./Navigable-Compute
          python -m pip install -e ./E-CPU
          python -m pip install -e ./VL-I
          python -m pip install pytest
      - name: Native SAT source-formed computation and rehome tests
        env:
          PYTHONPATH: ${{ github.workspace }}/In-Formation-Space/experiments/pnp-ground-navigation
        run: python -m unittest discover -s VL-I/tests -p test_problem_formed_sat.py -v
      - name: Formed Boolean architecture revision on native fenced SAT fabric
        env:
          PYTHONPATH: ${{ github.workspace }}/In-Formation-Space/experiments/pnp-ground-navigation
        run: python -m unittest discover -s VL-I/tests -p test_problem_formed_revision.py -v
      - name: SFI direct SAT source-ground checks
        working-directory: In-Formation-Space/experiments/pnp-ground-navigation
        run: python -m unittest -q test_self_forming_sat.py test_recursive_sat_compiler.py test_morphic_sat.py
      - name: Native PFI predecessor safety tests
        run: python -m unittest discover -s VL-I/tests -p test_problem_formed_claims.py -q
