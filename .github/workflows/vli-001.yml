name: VL-I-001 Ground and pretrained execution

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      live_model:
        type: boolean
        description: "Read pinned pretrained weight ranges and execute all 30 layers through VL-64"
        default: false

permissions:
  contents: read

jobs:
  ground:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VL64_SOURCE: upstream/vl64
      PYTHONPATH: upstream/vl64
    steps:
      - name: Checkout VL-I
        uses: actions/checkout@v4
      - name: Checkout immutable upstream VL-64
        uses: actions/checkout@v4
        with:
          repository: Kier73/VL-64
          ref: 9a08e7246ba4fb046270f88db2d38ab4c19368cb
          path: upstream/vl64
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install interpreter adapters
        run: |
          python -m pip install -e . -e upstream/vl64
      - name: Unit and real observed-header tests
        run: |
          python -m unittest discover -s tests -p test_vli_001.py -v
      - name: Lift pinned SmolLM2 structure and complete logits frontier
        run: |
          python -m vli inspect --manifest upstream/vl64/experiments/model_fabric/datasets/2026-11-18-pinned-smollm2-tensor-ground.json --out artifacts/real-model-ground.json
      - uses: actions/upload-artifact@v4
        with:
          name: vl-i-001-actual-observed-model-ground
          path: artifacts/real-model-ground.json

  real-pretrained:
    needs: ground
    if: github.event_name == 'workflow_dispatch' && inputs.live_model
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: upstream/vl64
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable upstream VL-64
        uses: actions/checkout@v4
        with:
          repository: Kier73/VL-64
          ref: 9a08e7246ba4fb046270f88db2d38ab4c19368cb
          path: upstream/vl64
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install VL-I and numeric dependencies
        run: |
          python -m pip install -e . -e upstream/vl64 numpy
      - name: Execute real 30-layer pretrained decoder from verified ranges
        run: |
          python -m vli run --manifest upstream/vl64/experiments/model_fabric/datasets/2026-11-18-pinned-smollm2-tensor-ground.json --tokens 42 75 --state-dir artifacts/real-model-state --upstream-out artifacts/upstream-pretrained-numeric.json --out artifacts/vli-realization.json
      - name: Independently reconstruct VL-I Ground and verify structural receipt binding
        run: |
          python -m vli verify --manifest upstream/vl64/experiments/model_fabric/datasets/2026-11-18-pinned-smollm2-tensor-ground.json --report artifacts/vli-realization.json
      - name: Retain and re-navigate the exact observed token without model computation
        run: |
          python -m vli remember --manifest upstream/vl64/experiments/model_fabric/datasets/2026-11-18-pinned-smollm2-tensor-ground.json --report artifacts/vli-realization.json --out artifacts/vli-retained.json
          HEAD=$(python -c "import json; print(json.load(open('artifacts/vli-retained.json'))['observation_digest'])")
          python -m vli navigate --manifest upstream/vl64/experiments/model_fabric/datasets/2026-11-18-pinned-smollm2-tensor-ground.json --retained artifacts/vli-retained.json --expected-head "$HEAD" --tokens 42 75 --out artifacts/vli-replayed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vl-i-001-full-pretrained-numerical-transcript
          path: |
            artifacts/vli-realization.json
            artifacts/upstream-pretrained-numeric.json
            artifacts/real-model-state/checkpoint.json
            artifacts/vli-retained.json
            artifacts/vli-replayed.json
          if-no-files-found: warn
