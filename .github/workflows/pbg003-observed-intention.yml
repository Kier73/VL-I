name: PBG-003 observed intention and material outcome

on:
  pull_request:
    paths:
      - "src/vli/goal_evidence_fabric.py"
      - "tests/test_goal_evidence_fabric.py"
      - "docs/OBSERVED_INTENTION_PBG003.md"
      - ".github/workflows/pbg003-observed-intention.yml"
  push:
    branches: [main]
    paths:
      - "src/vli/goal_evidence_fabric.py"
      - "tests/test_goal_evidence_fabric.py"
      - ".github/workflows/pbg003-observed-intention.yml"

jobs:
  observation-and-intervention:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: VL-I
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: Navigable-Compute
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 2c925e177734b88d4cf32961b24028dfee771e68
          path: E-CPU
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ae3f949b7d0b2aaa42236bc7cc37e9857384b174
          path: VGI
          sparse-checkout: |
            virtual_ground_interpreter
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned predecessor and intention Ground packages
        run: |
          python -m pip install -e ./Navigable-Compute
          python -m pip install -e ./E-CPU
          python -m pip install -e ./VGI/virtual_ground_interpreter
          python -m pip install -e "./VL-I[test]"
      - name: Execute receiver-admitted goal observation and action
        run: python -m unittest discover -s VL-I/tests -p test_goal_evidence_fabric.py -v
      - name: Regression exact intention Ground
        run: python -m pytest -q VL-I/tests/test_intention_predictive_ground.py VL-I/tests/test_predictive_basis_ground.py
      - name: Regression VGI host-route and cost-aware evidence
        run: python -m unittest discover -s VL-I/tests -p test_fabric_refinement.py -v
