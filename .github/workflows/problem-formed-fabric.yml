name: PFI-002 problem-formed observer fabric
on:
  push:
    paths:
      - 'src/vli/problem_formed_fabric.py'
      - 'tests/test_problem_formed_fabric.py'
      - 'examples/pfi_fabric_rehome.py'
      - 'docs/PROBLEM_FORMED_FABRIC_PFI002.md'
      - '.github/workflows/problem-formed-fabric.yml'
  pull_request:
    paths:
      - 'src/vli/problem_formed_fabric.py'
      - 'tests/test_problem_formed_fabric.py'
      - 'examples/pfi_fabric_rehome.py'
      - 'docs/PROBLEM_FORMED_FABRIC_PFI002.md'
      - '.github/workflows/problem-formed-fabric.yml'
jobs:
  fabric:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: VL-I
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          path: Navigable-Compute
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          path: E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual mathematical and execution repositories
        run: |
          python -m pip install -e ./Navigable-Compute
          python -m pip install -e ./E-CPU
          python -m pip install -e ./VL-I
      - name: Test generated host fabric, authority denial, checkpoint and rehome
        run: python -m unittest discover -s VL-I/tests -p test_problem_formed_fabric.py -v
      - name: Test predecessor self-generated interpreter
        run: python -m unittest discover -s VL-I/tests -p test_problem_formed_interpreter.py -v
