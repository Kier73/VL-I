name: VL-I NAV-002 exact causal state quotient

on:
  push:
    paths:
      - 'src/vli/exact_state_quotient.py'
      - 'tests/test_exact_state_quotient.py'
      - 'docs/NAV_002_EXACT_STATE_QUOTIENT.md'
      - '.github/workflows/vli-exact-state-quotient.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-markov-quotient-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONPATH: upstream/vl64:upstream/vl64/tests
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/VL-64
          ref: fea0d29d5a8a1edb03d9c66edd5ca4b15a1395d3
          path: upstream/vl64
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . -e upstream/vl64 'numpy>=1.26' 'pytest>=8'
      - name: Complete source-bound Markov quotient / prediction / adversarial verification
        run: python -m pytest -q tests/test_exact_state_quotient.py
      - name: Preserve verified predecessor causal-worker experiments
        run: python -m pytest -q tests/test_counterfactual_navigation.py tests/test_qwen_layer_chain.py tests/test_qwen_hybrid_block.py tests/test_qwen_hybrid_process_recovery.py
