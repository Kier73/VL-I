name: VL-I NAV-001 qualified counterfactual causal navigation

on:
  push:
    paths:
      - 'src/vli/counterfactual_navigation.py'
      - 'tests/test_counterfactual_navigation.py'
      - 'docs/NAV_001_COUNTERFACTUAL_CAUSAL_GROUND.md'
      - '.github/workflows/vli-counterfactual-navigation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualified-counterfactual-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONPATH: upstream/vl64:upstream/vl64/tests
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/VL-64
          ref: fea0d29d5a8a1edb03d9c66edd5ca4b15a1395d3
          path: upstream/vl64
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . -e upstream/vl64 'numpy>=1.26' 'pytest>=8'
      - name: Verify counterfactual numerical branches, retained futures and adversarial state pages
        run: python -m pytest -q tests/test_counterfactual_navigation.py
      - name: Preserve source-qualified predecessor execution and attention recovery
        run: python -m pytest -q tests/test_qwen_layer_chain.py tests/test_qwen_hybrid_block.py tests/test_qwen_hybrid_process_recovery.py
