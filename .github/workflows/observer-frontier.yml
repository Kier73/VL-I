name: Observer frontier NOC-001 and PBG-001

on:
  pull_request:
    paths:
      - "src/vli/nonlinear_observer_cut.py"
      - "src/vli/predictive_basis_ground.py"
      - "tests/test_nonlinear_observer_cut.py"
      - "tests/test_predictive_basis_ground.py"
      - "examples/predictive_basis_benchmark.py"
      - "examples/smollm_nonlinear_cut.py"
      - "docs/OBSERVER_BACKWARD_AND_PREDICTIVE_GROUND.md"
      - ".github/workflows/observer-frontier.yml"
  push:
    branches: [main]
    paths:
      - "src/vli/nonlinear_observer_cut.py"
      - "src/vli/predictive_basis_ground.py"
      - "tests/test_nonlinear_observer_cut.py"
      - "tests/test_predictive_basis_ground.py"
      - "examples/predictive_basis_benchmark.py"
      - ".github/workflows/observer-frontier.yml"

jobs:
  exact-and-nonlinear:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical and test extras
        run: python -m pip install -e ".[test,numerical]"
      - name: Run source-free mathematical parity and adversarial tests
        run: python -m pytest -q tests/test_nonlinear_observer_cut.py tests/test_predictive_basis_ground.py
      - name: Benchmark exact predictive continuation (no model download)
        run: python -m examples.predictive_basis_benchmark
