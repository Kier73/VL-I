name: TIME-001 environment-derived temporal intelligence

on:
  push:
    paths:
      - 'src/vli/temporal_intelligence.py'
      - 'tests/test_temporal_intelligence.py'
      - 'examples/temporal_intelligence_demo.py'
      - '.github/workflows/vli-temporal-intelligence.yml'
  pull_request:
    paths:
      - 'src/vli/temporal_intelligence.py'
      - 'tests/test_temporal_intelligence.py'
      - 'examples/temporal_intelligence_demo.py'
      - '.github/workflows/vli-temporal-intelligence.yml'
  workflow_dispatch:

jobs:
  time-001:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install VL-I package
        run: python -m pip install -e .
      - name: Verify TIME-001 adversarial and constructive cases
        run: python -m unittest discover -s tests -p test_temporal_intelligence.py -v
      - name: Execute independent derivation and continuity demonstration
        run: python -m examples.temporal_intelligence_demo
