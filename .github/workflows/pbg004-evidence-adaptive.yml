name: PBG-004 evidence-adaptive predictive Ground

on:
  pull_request:
    paths:
      - "src/vli/evidence_adaptive_ground.py"
      - "tests/test_evidence_adaptive_ground.py"
      - "tests/test_evidence_adaptive_fabric.py"
      - "docs/EVIDENCE_ADAPTIVE_GROUND_PBG004.md"
      - ".github/workflows/pbg004-evidence-adaptive.yml"
  push:
    branches: [main]
    paths:
      - "src/vli/evidence_adaptive_ground.py"
      - "tests/test_evidence_adaptive_ground.py"
      - "tests/test_evidence_adaptive_fabric.py"
      - ".github/workflows/pbg004-evidence-adaptive.yml"

jobs:
  source-law-revision:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: VL-I
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: Navigable-Compute
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 2c925e177734b88d4cf32961b24028dfee771e68
          path: E-CPU
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ae3f949b7d0b2aaa42236bc7cc37e9857384b174
          path: VGI
          sparse-checkout: |
            virtual_ground_interpreter
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned native transport and Ground packages
        run: |
          python -m pip install -e ./Navigable-Compute
          python -m pip install -e ./E-CPU
          python -m pip install -e ./VGI/virtual_ground_interpreter
          python -m pip install -e "./VL-I[test]"
      - name: Source-independent rational Ground and Bayesian verification
        run: python -m pytest -q VL-I/tests/test_evidence_adaptive_ground.py
      - name: Real E-CPU/VGI evidence and intervention reconciliation
        run: python -m pytest -q VL-I/tests/test_evidence_adaptive_fabric.py
      - name: PBG-001, PBG-002 and PBG-003 regression
        run: python -m pytest -q VL-I/tests/test_goal_evidence_fabric.py VL-I/tests/test_intention_predictive_ground.py VL-I/tests/test_predictive_basis_ground.py
