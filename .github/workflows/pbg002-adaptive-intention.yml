name: PBG-002 Adaptive intention predictive Ground

on:
  pull_request:
    paths:
      - "src/vli/intention_predictive_ground.py"
      - "tests/test_intention_predictive_ground.py"
      - "examples/adaptive_intention_lab.py"
      - "docs/ADAPTIVE_INTENTION_PBG002.md"
      - ".github/workflows/pbg002-adaptive-intention.yml"
  push:
    branches: [main]
    paths:
      - "src/vli/intention_predictive_ground.py"
      - "tests/test_intention_predictive_ground.py"
      - "examples/adaptive_intention_lab.py"
      - ".github/workflows/pbg002-adaptive-intention.yml"

jobs:
  rational-intention:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test package
        run: python -m pip install -e ".[test]"
      - name: Independently verify finite source, predictive Ground and planner
        run: python -m pytest -q tests/test_intention_predictive_ground.py tests/test_predictive_basis_ground.py
      - name: Run intent/observation/intervention lab without network calls
        run: python -m examples.adaptive_intention_lab
