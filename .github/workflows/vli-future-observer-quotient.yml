name: VL-I NAV-003 bounded observer-future equivalence

on:
  push:
    paths:
      - 'src/vli/future_observer_quotient.py'
      - 'tests/test_future_observer_quotient.py'
      - 'examples/future_observer_quotient_demo.py'
      - 'docs/NAV_003_OBSERVER_FUTURE_EQUIVALENCE.md'
      - '.github/workflows/vli-future-observer-quotient.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-future-observer-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONPATH: upstream/vl64:upstream/vl64/tests
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/VL-64
          ref: fea0d29d5a8a1edb03d9c66edd5ca4b15a1395d3
          path: upstream/vl64
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . -e upstream/vl64 'numpy>=1.26' 'pytest>=8'
      - name: Prove finite-horizon observer equivalence and reject false future merges
        run: python -m pytest -q tests/test_future_observer_quotient.py
      - name: Regress exact-state quotient and causal branch recovery
        run: python -m pytest -q tests/test_exact_state_quotient.py tests/test_counterfactual_navigation.py tests/test_qwen_layer_chain.py tests/test_qwen_hybrid_block.py tests/test_qwen_hybrid_process_recovery.py
      - name: Measure actual two-layer and hybrid finite-horizon observer proofs
        run: |
          python -m examples.future_observer_quotient_demo --mode two_gdn --out artifacts/nav003-two-gdn.json
          python -m examples.future_observer_quotient_demo --mode gdn_gdn_gdn_gqa --out artifacts/nav003-hybrid.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav003-observer-future-${{ matrix.python-version }}
          path: artifacts/nav003-*.json
          if-no-files-found: warn
