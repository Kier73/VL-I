name: TIME-007 intention-responsive self-interpreting state-space

on:
  push:
    paths:
      - 'src/vli/intention_state_space.py'
      - 'src/vli/reflective_rational.py'
      - 'tests/test_intention_state_space.py'
      - 'examples/intention_state_space_demo.py'
      - '.github/workflows/vli-intention-state-space.yml'
  pull_request:
    paths:
      - 'src/vli/intention_state_space.py'
      - 'src/vli/reflective_rational.py'
      - 'tests/test_intention_state_space.py'
      - 'examples/intention_state_space_demo.py'
      - '.github/workflows/vli-intention-state-space.yml'
  workflow_dispatch:

jobs:
  intention-navigation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install VL-I and cryptographic source verifier
        run: |
          python -m pip install -e .
          python -m pip install "cryptography>=46,<47"
      - name: Verify compact state-space and rational self-interpretation
        run: python -m unittest discover -s tests -p test_intention_state_space.py -v
      - name: Verify prior signed-source and physical process recovery
        run: python -m unittest discover -s tests -p test_authenticated_temporal_source.py -v
      - name: Verify evidence-qualified language changes
        run: python -m unittest discover -s tests -p test_evolving_environment_language.py -v
      - name: Demonstrate no trajectory table and two-level interpretation
        run: python -m examples.intention_state_space_demo
