name: TDL-006 SAB routes bound to live authenticated peers
on:
  pull_request:
    paths:
      - 'src/vli/routed_authenticated_refinement.py'
      - 'src/vli/routed_authenticated_verify.py'
      - 'tests/test_routed_authenticated_refinement.py'
      - '.github/workflows/tdl006-routed-authenticated.yml'
  push:
    paths:
      - 'src/vli/routed_authenticated_refinement.py'
      - 'src/vli/routed_authenticated_verify.py'
      - 'tests/test_routed_authenticated_refinement.py'
      - '.github/workflows/tdl006-routed-authenticated.yml'

jobs:
  endpoint-binding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: VL-I
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: Navigable-Compute
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 2c925e177734b88d4cf32961b24028dfee771e68
          path: E-CPU
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ae3f949b7d0b2aaa42236bc7cc37e9857384b174
          path: VGI
          sparse-checkout: |
            virtual_ground_interpreter
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify OpenSSL available for genuine peer certificate tests
        run: openssl version
      - name: Install source Grounds, E-CPU TLS service and VGI
        run: |
          python -m pip install -e ./Navigable-Compute
          python -m pip install -e ./E-CPU
          python -m pip install -e ./VGI/virtual_ground_interpreter
          python -m pip install -e ./VL-I
      - name: Exercise exact route endpoint to native TLS peer binding
        run: python -m unittest discover -s VL-I/tests -p test_routed_authenticated_refinement.py -v
      - name: Regression live IOS TLS VGI source quorum
        run: python -m unittest discover -s VL-I/tests -p test_authenticated_refinement.py -v
      - name: Regression receiver-admitted E-CPU observation paths
        run: python -m unittest discover -s VL-I/tests -p test_fabric_refinement.py -v
