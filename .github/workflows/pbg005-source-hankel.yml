name: PBG-005 source-derived Hankel Ground

on:
  pull_request:
    paths:
      - 'src/vli/source_hankel_ground.py'
      - 'src/vli/source_hankel_fabric.py'
      - 'tests/test_source_hankel_ground.py'
      - 'tests/test_source_hankel_fabric.py'
      - 'examples/source_hankel_demo.py'
      - 'docs/SOURCE_DERIVED_GROUND_PBG005.md'
      - '.github/workflows/pbg005-source-hankel.yml'
  push:
    branches: [main]
    paths:
      - 'src/vli/source_hankel_ground.py'
      - 'src/vli/source_hankel_fabric.py'
      - 'tests/test_source_hankel_ground.py'
      - 'tests/test_source_hankel_fabric.py'
      - 'examples/source_hankel_demo.py'
      - '.github/workflows/pbg005-source-hankel.yml'

jobs:
  native-source-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: VL-I
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: Navigable-Compute
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 2c925e177734b88d4cf32961b24028dfee771e68
          path: E-CPU
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ae3f949b7d0b2aaa42236bc7cc37e9857384b174
          path: VGI
          sparse-checkout: |
            virtual_ground_interpreter
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install predecessor interpreters and source-view package
        run: |
          python -m pip install -e ./Navigable-Compute
          python -m pip install -e ./E-CPU
          python -m pip install -e ./VGI/virtual_ground_interpreter
          python -m pip install -e "./VL-I[test]"
      - name: Test exact observation-basis learner and independent verifier
        run: python -m pytest -q VL-I/tests/test_source_hankel_ground.py
      - name: Test native E-CPU/VGI qualified trace oracle and historical replay
        run: python -m pytest -q VL-I/tests/test_source_hankel_fabric.py
      - name: Regression PBG-004 evidence-adaptive revisions
        run: python -m pytest -q VL-I/tests/test_evidence_adaptive_ground.py VL-I/tests/test_evidence_adaptive_fabric.py
      - name: Run end-to-end source-derived Ground demonstration
        run: python VL-I/examples/source_hankel_demo.py
